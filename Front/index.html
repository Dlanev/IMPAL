<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IM Music - Home</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="mobile-container">
        
        <header class="app-header">
            <div class="logo">
                <span>IM Music</span>
            </div>
            <div class="header-icons">
                <a href="profile.html"><i class="far fa-user-circle"></i></a>
            </div>
        </header>

        <main class="main-content" style="padding-top: 20px;">
            <h3 class="section-title">Baru Saja Ditambahkan</h3>
            <div class="playlist-row" id="recentSongsContainer">
                <p style="color: #b3b3b3; font-size: 14px;">Memuat lagu...</p>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="search.html" class="nav-item">
                <i class="fas fa-search"></i>
                <span>Cari</span>
            </a>
            <a href="library.html" class="nav-item">
                <i class="fas fa-book-open"></i>
                <span>Koleksi</span>
            </a>
        </nav>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = "login.html";
                return;
            }

            try {
                const response = await fetch('http://localhost:8080/api/songs', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const result = await response.json();
                const container = document.getElementById('recentSongsContainer');

                if (response.ok) {
                    const songs = result.data;
                    if (!songs || songs.length === 0) {
                        container.innerHTML = '<p style="color: #b3b3b3;">Belum ada lagu tersedia.</p>';
                        return;
                    }

                    container.innerHTML = ''; // clear loading
                    songs.forEach(song => {
                        const card = document.createElement('div');
                        card.className = 'playlist-card';
                        card.onclick = () => PlayerOverlay.play(song.ID);
                        
                        const coverStyle = song.CoverURL 
                            ? `background-image: url('http://localhost:8080${song.CoverURL}');` 
                            : '';

                        card.innerHTML = `
                            <div class="card-img" style="${coverStyle}"></div>
                            <h4 style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${song.Title}</h4>
                            <p style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${song.Artist}</p>
                            <div class="song-actions" style="margin-top:6px;">
                                <i class="far fa-heart" title="Suka" onclick="event.stopPropagation(); Actions.like(${song.ID})"></i>
                                <i class="fas fa-plus" title="Tambah ke playlist" onclick="event.stopPropagation(); Actions.addToPlaylist(${song.ID})"></i>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<p style="color: #E61E32;">Gagal memuat lagu.</p>`;
                }
            } catch (error) {
                console.error("Error fetching songs:", error);
                document.getElementById('recentSongsContainer').innerHTML = '<p style="color: #E61E32;">Terjadi kesalahan jaringan.</p>';
            }
        });
    </script>

    <script src="js/player-overlay.js"></script>
    <script src="js/playlist-ui.js"></script>
</body>
</html>
