<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IM Music - Profil</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="mobile-container">
        
        <!-- HEADER ATAS -->
        <header class="app-header">
            <div class="logo">
                <span>IM Music</span>
            </div>
            <div class="header-icons">
                <a href="profile.html" style="color: #ffffff;"><i class="fas fa-user-circle"></i></a>
            </div>
        </header>

        <!-- KONTEN UTAMA HALAMAN PROFIL -->
        <main class="main-content">
            <h2>Profil</h2>
            
            <div class="profile-card">
                <div class="profile-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <h3 id="profileName">Memuat...</h3>
            </div>
            
            <div class="profile-menu">
                
                <!-- Baris Informasi Nama Pengguna -->
                <div class="menu-row">
                    <span>Nama Pengguna</span> 
                    <span id="profileUsername" style="color: #b3b3b3; font-weight: 400;">-</span>
                </div>
                
                <!-- Baris Informasi Alamat Email -->
                <div class="menu-row">
                    <span>Email</span> 
                    <span id="profileEmail" style="color: #b3b3b3; font-weight: 400;">-</span>
                </div>

                <!-- Baris Informasi Peran -->
                <div class="menu-row">
                    <span>Peran</span> 
                    <span id="profileRole" style="color: #b3b3b3; font-weight: 400;">-</span>
                </div>
                
                <!-- Menu Keluar -->
                <div class="menu-row" style="color: #E61E32;" onclick="logout()">
                    <span>Keluar</span>
                </div>
            </div>
        </main>

        <!-- NAVBAR BAWAH -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="search.html" class="nav-item">
                <i class="fas fa-search"></i>
                <span>Cari</span>
            </a>
            <a href="library.html" class="nav-item">
                <i class="fas fa-book-open"></i>
                <span>Koleksi</span>
            </a>
        </nav>

    </div>
    <script>
        const API_BASE = 'http://localhost:8080';
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = 'login.html'; }

        function logout() {
            localStorage.removeItem('token');
            // also clear persisted player state
            ['im_songId','im_songTitle','im_songArtist','im_coverUrl','im_audioUrl','im_currentTime','im_isPlaying']
                .forEach(k => localStorage.removeItem(k));
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(`${API_BASE}/api/auth/profile`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.status === 401) { logout(); return; }
                const result = await res.json();
                if (res.ok && result.data) {
                    const u = result.data;
                    document.getElementById('profileName').innerText = u.Username || '-';
                    document.getElementById('profileUsername').innerText = u.Username || '-';
                    document.getElementById('profileEmail').innerText = u.Email || '-';
                    document.getElementById('profileRole').innerText = u.Role || '-';
                } else {
                    document.getElementById('profileName').innerText = 'Gagal memuat profil';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('profileName').innerText = 'Kesalahan jaringan';
            }
        });
    </script>
    <script src="js/player-overlay.js"></script>
</body>
</html>
