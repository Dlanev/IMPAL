<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musikita - Hasil Pencarian</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="mobile-container">

        <header class="app-header">
            <div class="logo">
                <span>Musikita</span>
            </div>
            <div class="header-icons">
                <a href="history.html"><i class="far fa-clock"></i></a>
                <a href="profile.html"><i class="far fa-user-circle"></i></a>
            </div>
        </header>

        <main class="main-content">

            <!-- Search Bar dengan Tombol Kembali -->
            <div class="search-bar-container with-back">
                <a href="search.html" class="back-link"><i class="fas fa-arrow-left"></i></a>
                <div style="position: relative; flex: 1;">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInputResult" placeholder="Apa yang ingin kamu dengarkan?" class="search-input" onkeyup="if(event.key === 'Enter') updateQuery()">
                </div>
            </div>

            <!-- Label menunjukkan kata kunci yang dicari -->
            <p class="search-query-label">Menampilkan hasil untuk: <span id="queryLabel">...</span></p>

            <!-- Daftar Hasil Pencarian (Placeholder Generik) -->
            <div class="library-list" id="resultList">

                <div class="result-item" onclick="window.location.href='player.html?judul=Hasil Pencarian 1&artis=Artis Tidak Diketahui'">
                    <div class="result-img"><i class="fas fa-music"></i></div>
                    <div class="result-info">
                        <h4>Hasil Pencarian 1</h4>
                        <p>Lagu • Artis Tidak Diketahui</p>
                    </div>
                </div>

                <div class="result-item" onclick="window.location.href='player.html?judul=Hasil Pencarian 2&artis=Artis Tidak Diketahui'">
                    <div class="result-img"><i class="fas fa-music"></i></div>
                    <div class="result-info">
                        <h4>Hasil Pencarian 2</h4>
                        <p>Lagu • Artis Tidak Diketahui</p>
                    </div>
                </div>

                <div class="result-item" onclick="window.location.href='player.html?judul=Hasil Pencarian 3&artis=Artis Tidak Diketahui'">
                    <div class="result-img"><i class="fas fa-music"></i></div>
                    <div class="result-info">
                        <h4>Hasil Pencarian 3</h4>
                        <p>Lagu • Artis Tidak Diketahui</p>
                    </div>
                </div>

                <div class="result-item" onclick="window.location.href='player.html?judul=Hasil Pencarian 4&artis=Artis Tidak Diketahui'">
                    <div class="result-img"><i class="fas fa-music"></i></div>
                    <div class="result-info">
                        <h4>Hasil Pencarian 4</h4>
                        <p>Lagu • Artis Tidak Diketahui</p>
                    </div>
                </div>

            </div>

        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="search.html" class="nav-item active">
                <i class="fas fa-search"></i>
                <span>Cari</span>
            </a>
            <a href="library.html" class="nav-item">
                <i class="fas fa-book-open"></i>
                <span>Koleksi</span>
            </a>
        </nav>

    </div>

    <script>
        // Ambil kata kunci pencarian dari URL (dikirim oleh halaman search.html)
        const params = new URLSearchParams(window.location.search);
        const keyword = params.get('q');

        const queryLabel = document.getElementById('queryLabel');
        const searchInputResult = document.getElementById('searchInputResult');

        if (keyword) {
            queryLabel.innerText = '"' + keyword + '"';
            searchInputResult.value = keyword;
        } else {
            queryLabel.innerText = '(kosong)';
        }

        // Memungkinkan user mengetik ulang kata kunci baru langsung dari halaman ini
        function updateQuery() {
            const newKeyword = searchInputResult.value.trim();
            window.location.href = 'hasil-search.html?q=' + encodeURIComponent(newKeyword);
        }
    </script>

</body>
</html>
