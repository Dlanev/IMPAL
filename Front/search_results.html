<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IM Music - Hasil Pencarian</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="mobile-container">

        <header class="app-header">
            <div class="logo">
                <span>IM Music</span>
            </div>
            <div class="header-icons">
                <a href="profile.html"><i class="far fa-user-circle"></i></a>
            </div>
        </header>

        <main class="main-content">

            <!-- Search Bar dengan Tombol Kembali -->
            <div class="search-bar-container with-back">
                <a href="search.html" class="back-link"><i class="fas fa-arrow-left"></i></a>
                <div style="position: relative; flex: 1;">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInputResult" placeholder="Apa yang ingin kamu dengarkan?" class="search-input" onkeyup="if(event.key === 'Enter') updateQuery()">
                </div>
            </div>

            <!-- Label kata kunci -->
            <p class="search-query-label">Menampilkan hasil untuk: <span id="queryLabel">...</span></p>

            <!-- Daftar Hasil Pencarian dari API -->
            <div class="library-list" id="resultList">
                <p style="color: #b3b3b3; font-size: 14px;">Mencari lagu...</p>
            </div>

        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="search.html" class="nav-item active">
                <i class="fas fa-search"></i>
                <span>Cari</span>
            </a>
            <a href="library.html" class="nav-item">
                <i class="fas fa-book-open"></i>
                <span>Koleksi</span>
            </a>
        </nav>

    </div>

    <script>
        const API_BASE = 'http://localhost:8080';
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'login.html';
        }

        const params = new URLSearchParams(window.location.search);
        const keyword = params.get('q');

        const queryLabel = document.getElementById('queryLabel');
        const searchInputResult = document.getElementById('searchInputResult');

        if (keyword) {
            queryLabel.innerText = '"' + keyword + '"';
            searchInputResult.value = keyword;
            fetchSearchResults(keyword);
        } else {
            queryLabel.innerText = '(kosong)';
            document.getElementById('resultList').innerHTML = '<p style="color: #b3b3b3;">Masukkan kata kunci untuk mencari lagu.</p>';
        }

        async function fetchSearchResults(q) {
            const container = document.getElementById('resultList');
            try {
                const response = await fetch(`${API_BASE}/api/songs/search?q=${encodeURIComponent(q)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const result = await response.json();

                if (response.ok) {
                    const songs = result.data;
                    if (!songs || songs.length === 0) {
                        container.innerHTML = '<p style="color: #b3b3b3;">Tidak ada lagu yang ditemukan.</p>';
                        return;
                    }

                    container.innerHTML = '';
                    songs.forEach(song => {
                        const item = document.createElement('div');
                        item.className = 'result-item';
                        item.onclick = () => PlayerOverlay.play(song.ID);

                        const imgContent = song.CoverURL
                            ? `<img src="${API_BASE}${song.CoverURL}" alt="cover" style="width:100%;height:100%;object-fit:cover;border-radius:6px;">`
                            : `<i class="fas fa-music"></i>`;

                        item.innerHTML = `
                            <div class="result-img">${imgContent}</div>
                            <div class="result-info">
                                <h4>${song.Title}</h4>
                                <p>Lagu • ${song.Artist}</p>
                            </div>
                        `;
                        container.appendChild(item);
                    });
                } else {
                    container.innerHTML = `<p style="color: #E61E32;">Gagal memuat hasil pencarian.</p>`;
                }
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<p style="color: #E61E32;">Terjadi kesalahan jaringan.</p>`;
            }
        }

        // User mengetik ulang kata kunci baru
        function updateQuery() {
            const newKeyword = searchInputResult.value.trim();
            if (newKeyword) {
                window.location.href = `search_results.html?q=${encodeURIComponent(newKeyword)}`;
            }
        }
    </script>

    <script src="js/player-overlay.js"></script>
</body>
</html>
