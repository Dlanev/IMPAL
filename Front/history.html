<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IM Music - Riwayat</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="mobile-container">
        
        <header class="app-header">
            <div class="logo">
                <span>IM Music</span>
            </div>
            <div class="header-icons">
                <a href="history.html" style="color: #ffffff;"><i class="fas fa-clock"></i></a>
                <a href="profile.html"><i class="far fa-user-circle"></i></a>
            </div>
        </header>

        <main class="main-content">
            <h2>Baru Saja Diputar</h2>
            
            <div class="history-list" id="historyContainer">
                <p style="color: #b3b3b3; font-size: 14px;">Memuat riwayat...</p>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="search.html" class="nav-item">
                <i class="fas fa-search"></i>
                <span>Cari</span>
            </a>
            <a href="library.html" class="nav-item">
                <i class="fas fa-book-open"></i>
                <span>Koleksi</span>
            </a>
        </nav>

    </div>

    <script>
        const API_BASE = 'http://localhost:8080';
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('historyContainer');
            try {
                const response = await fetch(`${API_BASE}/api/history`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const result = await response.json();

                if (response.ok) {
                    const histories = result.data;
                    if (!histories || histories.length === 0) {
                        container.innerHTML = '<p style="color: #b3b3b3;">Belum ada riwayat putar.</p>';
                        return;
                    }

                    container.innerHTML = '';
                    histories.forEach(item => {
                        const song = item.Song || {};
                        const div = document.createElement('div');
                        div.className = 'history-item';

                        const coverStyle = song.CoverURL
                            ? `background-image: url('${API_BASE}${song.CoverURL}'); background-size: cover; background-position: center;`
                            : '';

                        div.innerHTML = `
                            <div class="hist-img" onclick="window.location.href='player.html?id=${song.ID}'" style="${coverStyle} cursor:pointer;"></div>
                            <div class="hist-info" onclick="window.location.href='player.html?id=${song.ID}'" style="cursor:pointer;">
                                <h4>${song.Title || 'Unknown'}</h4>
                                <p>${song.Artist || '-'}</p>
                            </div>
                            <i class="fas fa-ellipsis-v"></i>
                        `;
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = `<p style="color: #E61E32;">Gagal memuat riwayat.</p>`;
                }
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<p style="color: #E61E32;">Terjadi kesalahan jaringan.</p>`;
            }
        });
    </script>

</body>
</html>
