<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IM Music - Daftar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="mobile-container">

        <!-- KONTEN UTAMA REGISTER -->
        <div class="login-container">

            <!-- Logo Utama Aplikasi -->
            <div class="login-logo">IM Music</div>

            <!-- Form Register (Tampilan Saja, Tanpa Logika) -->
            <form class="login-form" id="registerForm">

                <!-- Input Nama Pengguna -->
                <div class="input-group">
                    <label for="username">Nama Pengguna</label>
                    <input type="text" id="username" class="login-input" placeholder="Masukkan nama pengguna" required>
                </div>

                <!-- Input Email -->
                <div class="input-group">
                    <label for="regEmail">Alamat Email</label>
                    <input type="email" id="regEmail" class="login-input" placeholder="Masukkan email kamu" required>
                </div>

                <!-- Input Kata Sandi -->
                <div class="input-group">
                    <label for="regPassword">Kata Sandi</label>
                    <input type="password" id="regPassword" class="login-input" placeholder="Buat kata sandi" required>
                </div>

                <!-- Input Konfirmasi Kata Sandi -->
                <div class="input-group">
                    <label for="confirmPassword">Konfirmasi Kata Sandi</label>
                    <input type="password" id="confirmPassword" class="login-input" placeholder="Ulangi kata sandi" required>
                </div>

                <!-- Input Role -->
                <div class="input-group">
                    <label for="role">Daftar Sebagai</label>
                    <select id="role" class="login-input" style="background-color: #222; color: #fff; border: 1px solid #444;" required>
                        <option value="listener">Pendengar</option>
                        <option value="musician">Musisi</option>
                    </select>
                </div>

                <!-- Pesan Error -->
                <div id="errorTxt" class="error-message" style="color: #E61E32; margin-bottom: 10px;"></div>

                <!-- Tombol Daftar -->
                <button type="submit" class="login-btn" style="width: 100%;">Daftar</button>

                <!-- Link Menuju Halaman Login -->
                <p class="auth-switch-text">Sudah punya akun?</p>
                <a href="login.html" class="register-btn">Masuk</a>

            </form>

        </div>

    </div>

    <!-- LOGIKA REGISTER -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault(); 
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('role').value;
            const errorTxt = document.getElementById('errorTxt');

            if (password !== confirmPassword) {
                errorTxt.innerText = "Kata sandi tidak cocok!";
                return;
            }

            try {
                const response = await fetch('http://localhost:8080/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, role })
                });

                const result = await response.json();
                
                if (response.ok) {
                    alert("Registrasi berhasil! Silakan login.");
                    window.location.href = "login.html"; 
                } else {
                    errorTxt.innerText = result.message || result.error || "Gagal melakukan registrasi.";
                }
            } catch (error) {
                errorTxt.innerText = "Terjadi kesalahan pada server.";
                console.error(error);
            }
        });
    </script>

</body>
</html>
